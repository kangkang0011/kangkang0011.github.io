<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>李康康 · 个人主页</title>
<style>
:root{--bg1:#667eea;--bg2:#764ba2;--card:#ffffff;--text:#1f2937;--muted:#6b7280;--accent:#6366f1;}
*{margin:0;padding:0;box-sizing:border-box;}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:24px;color:var(--text);}
.wrap{width:100%;max-width:720px;background:var(--card);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.2);padding:48px 40px;text-align:center;}
.avatar{width:96px;height:96px;margin:0 auto 20px;border-radius:50%;background:linear-gradient(135deg,var(--bg1),var(--bg2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:700;}
h1{font-size:32px;letter-spacing:1px;}
.sub{color:var(--muted);margin-top:4px;}
.tagline{margin:22px 0 8px;font-size:18px;font-weight:600;}
.bio{color:var(--muted);line-height:1.8;}
.links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:28px 0;}
.links a{display:inline-flex;align-items:center;gap:8px;padding:11px 22px;border-radius:999px;background:#f3f4f6;color:var(--text);text-decoration:none;font-size:15px;transition:.2s;}
.links a:hover{background:var(--accent);color:#fff;transform:translateY(-2px);}
.projects{text-align:left;margin-top:32px;}
.projects h2{font-size:18px;margin-bottom:14px;text-align:center;}
.project{display:block;padding:16px 18px;border:1px solid #e5e7eb;border-radius:14px;margin-bottom:12px;text-decoration:none;color:var(--text);transition:.2s;}
.project:hover{border-color:var(--accent);box-shadow:0 6px 20px rgba(99,102,241,.15);}
.project h3{font-size:16px;}
.project p{color:var(--muted);font-size:14px;margin-top:4px;}
footer{margin-top:28px;color:#9ca3af;font-size:13px;}
</style>
</head>
<body><div class="wrap">

</div>
